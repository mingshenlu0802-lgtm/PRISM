<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B0E24'/%3E%3Cpath d='M6 16h7' stroke='%23FBF8F2' stroke-width='1.6'/%3E%3Cpath d='M13 7.5 21.5 24H4.5Z' fill='none' stroke='%23FBF8F2' stroke-width='1.7' stroke-linejoin='round' transform='translate(1.5 0) scale(0.82) translate(2 2)'/%3E%3Cpath d='M17 15.2h10' stroke='%235E72C8' stroke-width='1.5'/%3E%3Cpath d='M17 17.4h10' stroke='%233F9A93' stroke-width='1.5'/%3E%3Cpath d='M17 19.6h10' stroke='%23D64F37' stroke-width='1.5'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      字体必须是「不挡路」的。

      这里原来是一个普通的 <link rel="stylesheet">，而 <head> 里没下完的样式表
      会**同时挡住渲染和后面 script 的执行**——整个应用要等它有个结果才开始跑。
      平时在能连上 Google 的地方，那是几十毫秒，看不出来。

      问题是这个站的读者有很大一部分在墙内，而 fonts.googleapis.com 在那里
      连不上。连不上不是「立刻失败」，是**挂着**：要等 TCP 自己超时。
      实测在一个出不去网的环境里，首屏因此空白了十三秒——十三秒里
      页面上一个字都没有，而所有内容其实就在本地，随时可以画出来。
      为了一套锦上添花的字形，把内容扣住十三秒，这笔账怎么算都不对。

      `media="print"` 让浏览器认为这张表跟当前设备无关，于是照下不误、
      但不挡渲染；下完了再把 media 改回 all，字体就换上去。连不上就一直是
      平台字体栈——那本来就是设计里写好的后备，页面照样成立。
    -->
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
    />
    <!-- 站点靠链接分享，不希望被搜到。这挡得住守规矩的搜索引擎，
         挡不住把链接转发出去的人——链接本身就是全部的门禁。 -->
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="description" content="每日更新的全球女性主义与 LGBTQIA+ 新闻与研究：一段简短总结，加上报道这条新闻的媒体链接。" />
    <title>PRISM 棱镜</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
