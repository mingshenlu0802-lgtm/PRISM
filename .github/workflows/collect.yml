# 真实新闻收集。
#
# 控制端里的「找新闻」是原型，取的是虚构素材、假链接。这个才是真的：
# 它去订阅真实媒体的 RSS，把条目写进数据库——**一律先下架**，
# 站长在控制端一条条看过、按「重新上线」，读者才看得到。
#
# 为什么跑在这里而不是浏览器里：静态站没有后端可以跑定时任务，
# 而且抓取需要出网、写库需要一把不能进浏览器的密钥。Actions 两样都有。
name: 找新闻

on:
  schedule:
    # 站长要一天两次，北京时间：
    #   早上 6:00 → 15 条新闻 + 3 个研究
    #   下午 2:00 → 15 条新闻（研究一天一次就够，机构不会一天发两批）
    #
    # cron 按 UTC 走，所以要减八小时。早上 6:00 落在前一天的 22:00 UTC，
    # 下午 2:00 落在当天的 06:00 UTC。
    #
    # **为什么是 17 分，不是整点。** 定时任务在 GitHub 上是尽力而为的：
    # 负载高的时候会延迟，也会**整场丢掉**，而整点是全世界最挤的那一格。
    # 这个仓库到现在为止，定时触发一次都没有真的跑起来（Actions 里只有
    # 手动触发的记录）——错开几分钟是这件事最常见也最有效的办法。
    # 北京时间因此是 06:17 和 14:17，跟站长要的差十几分钟，不差一场新闻。
    #
    # 定时触发没法带 inputs，所以下面用 github.event.schedule 分辨是哪一场。
    - cron: '17 22 * * *'
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      max:
        description: '这次最多处理多少条新闻（默认 15，越少越省）'
        type: string
        default: '15'
      studies:
        description: '这次最多加几项研究（默认 3）'
        type: string
        default: '3'
      dry:
        description: '只看抓到什么，不写数据库'
        type: boolean
        default: false
      hold:
        description: '全部先下架等审核（默认自动上线）'
        type: boolean
        default: false
      purge:
        description: '先清空网站所有新闻与研究（不碰成员名单）'
        type: boolean
        default: false
      probe:
        description: '只探测这个 key 能用哪些模型，不抓取也不写库'
        type: boolean
        default: false
      probe_models:
        description: '想试的型号名，空格分隔（留空则试它列出来的前几个）'
        type: string
        default: ''
      search:
        description: '联网二次搜索，给每条新闻补到 3-5 个来源（花钱，但站长要求的就是这个）'
        type: boolean
        default: true
      effort:
        description: '模型下多大力气：low / medium / high / xhigh / max'
        type: string
        default: 'high'

# 同时只跑一个，免得两次收集互相写重复条目。
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 默认是六小时。这个 job 正常跑二十分钟上下，卡住的话没有理由让它
    # 占着 runner 烧一整个上午的额度——而且下一场定时收集会被 concurrency
    # 挡在门外，等于一次卡死连累后面几场。
    timeout-minutes: 120
    # 这个 job 只读代码、往 Supabase 写。给它的 token 就不该有别的权力。
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 收集脚本现在用官方的 @anthropic-ai/sdk（联网搜索是它的服务端工具）。
      # --omit=dev 把 playwright 那几百兆挡在外面：那是给界面检查用的，
      # 这个 job 一行都不碰。
      - name: 装依赖
        run: npm ci --omit=dev

      # 没配密钥就只做一次演练，并且把该配什么说清楚。
      # 这样第一次运行不需要任何准备，就能知道 27 个源里哪些还活着。
      - name: 决定这次是演练还是真写
        id: mode
        env:
          HAS_URL: ${{ secrets.SUPABASE_URL != '' }}
          HAS_KEY: ${{ secrets.SUPABASE_SERVICE_KEY != '' }}
        run: |
          if [ "${{ inputs.dry }}" = "true" ] || [ "$HAS_URL" != "true" ] || [ "$HAS_KEY" != "true" ]; then
            echo "dry=--dry" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.dry }}" != "true" ]; then
              echo "::notice::还没配密钥，这次只做演练。要真的写进数据库，去 Settings → Secrets and variables → Actions 添加 SUPABASE_URL 和 SUPABASE_SERVICE_KEY。"
            fi
          else
            echo "dry=" >> "$GITHUB_OUTPUT"
          fi

      # 站长要「真正免费的 API」。我在的环境连不上任何供应商，查不了；
      # 这台 runner 可以，所以让它去问，并且真的发一次最小请求——
      # 「有免费额度」和「你这个账号现在能不能免费跑」是两回事。
      #
      # 第一次跑就抓到了一个我自己的错：我以为 GitHub Models 可以白用，
      # 它回的是 HTTP 410，在退役。所以这一步不是可有可无的。
      - name: 探测模型
        if: inputs.probe
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: node scripts/llm-check.mjs ${{ inputs.probe_models }}

      - name: 清空内容
        if: inputs.purge
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/purge-news.mjs

      - name: 抓取
        if: '!inputs.probe'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AUTO_PUBLISH: ${{ inputs.hold && '0' || '1' }}
          # 模型。有 ANTHROPIC_API_KEY 就走 Claude（站长选的这条）；
          # 没有就看 LLM_* 那三个，任何 OpenAI 兼容的服务都行。
          # 都没有就退回不带模型的模式，那时候摘要还是英文的。
          # 不确定型号名填什么，先勾 probe 跑一次，它会列出来。
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          MAX_ITEMS: ${{ inputs.max || '15' }}
          # 联网找来源。站长要「加上 3-5 个 sources，看完 sources，进行总结」，
          # 所以默认开着；勾掉 search 就是 0，只用 RSS 里已有的来源。
          LLM_SEARCH: ${{ inputs.search == false && '0' || '1' }}
          LLM_EFFORT: ${{ inputs.effort || 'high' }}
          # 研究只在早上那一场收。下午那场（06:00 UTC）设成 0——
          # 发布方一天不会出两批报告，第二次去抓只会抓到同样的东西再被去重掉。
          MAX_STUDIES: ${{ inputs.studies || (github.event.schedule == '17 6 * * *' && '0' || '3') }}
        run: node scripts/collect-feeds.mjs ${{ steps.mode.outputs.dry }}
