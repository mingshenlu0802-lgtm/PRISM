# 真实新闻收集。
#
# 控制端里的「找新闻」是原型，取的是虚构素材、假链接。这个才是真的：
# 它去订阅真实媒体的 RSS，把条目写进数据库——**一律先下架**，
# 站长在控制端一条条看过、按「重新上线」，读者才看得到。
#
# 为什么跑在这里而不是浏览器里：静态站没有后端可以跑定时任务，
# 而且抓取需要出网、写库需要一把不能进浏览器的密钥。Actions 两样都有。
name: 找新闻

on:
  schedule:
    # UTC 22:00 = 北京/台北早上 6 点，站长起来就能看到一批待审的。
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      max:
        description: '这次最多处理多少条（默认 30，越少越省）'
        type: string
        default: '30'
      dry:
        description: '只看抓到什么，不写数据库'
        type: boolean
        default: false
      hold:
        description: '全部先下架等审核（默认自动上线）'
        type: boolean
        default: false
      purge:
        description: '先清空网站所有新闻与研究（不碰成员名单）'
        type: boolean
        default: false
      probe:
        description: '只探测这个 key 能用哪些模型，不抓取也不写库'
        type: boolean
        default: false
      probe_models:
        description: '想试的型号名，空格分隔（留空则试它列出来的前几个）'
        type: string
        default: ''

# 同时只跑一个，免得两次收集互相写重复条目。
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # models: read 就是「真正免费」那把钥匙——GitHub Models 用仓库自带的
    # token 就能调，不用绑卡、不用注册第三方、不用再存一把密钥。
    # 写清 contents: read 是因为一旦写了 permissions，默认权限就全被收回，
    # checkout 还要读代码。
    permissions:
      contents: read
      models: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 没配密钥就只做一次演练，并且把该配什么说清楚。
      # 这样第一次运行不需要任何准备，就能知道 27 个源里哪些还活着。
      - name: 决定这次是演练还是真写
        id: mode
        env:
          HAS_URL: ${{ secrets.SUPABASE_URL != '' }}
          HAS_KEY: ${{ secrets.SUPABASE_SERVICE_KEY != '' }}
        run: |
          if [ "${{ inputs.dry }}" = "true" ] || [ "$HAS_URL" != "true" ] || [ "$HAS_KEY" != "true" ]; then
            echo "dry=--dry" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.dry }}" != "true" ]; then
              echo "::notice::还没配密钥，这次只做演练。要真的写进数据库，去 Settings → Secrets and variables → Actions 添加 SUPABASE_URL 和 SUPABASE_SERVICE_KEY。"
            fi
          else
            echo "dry=" >> "$GITHUB_OUTPUT"
          fi

      # 站长要「真正免费的 API」。我在的环境连不上任何供应商，查不了；
      # 这台 runner 可以，所以让它去问，并且真的发一次最小请求——
      # 「有免费额度」和「你这个账号现在能不能免费跑」是两回事。
      - name: 探测模型
        if: inputs.probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: node scripts/llm-check.mjs ${{ inputs.probe_models }}

      - name: 清空内容
        if: inputs.purge
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/purge-news.mjs

      - name: 抓取
        if: '!inputs.probe'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AUTO_PUBLISH: ${{ inputs.hold && '0' || '1' }}
          # 模型，按这个顺序挑：
          #   1 三个 LLM_* 都配齐了 → 用你自己的（任何 OpenAI 兼容的服务）
          #   2 什么都没配 → GitHub Models，用下面这把仓库自带的 token
          # 所以「不配任何密钥」也有模型可用，这是默认路径，不是降级路径。
          GITHUB_TOKEN: ${{ github.token }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          MAX_ITEMS: ${{ inputs.max || '30' }}
        run: node scripts/collect-feeds.mjs ${{ steps.mode.outputs.dry }}
